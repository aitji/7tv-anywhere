<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>7TV Anywhere runtime harness</title>
</head>
<body>
    <main>
        <h1>Live content test</h1>
        <section aria-label="YouTube live chat">
            <span id="message" dir="auto" class="style-scope yt-live-chat-text-message-renderer">PauseSama RainTime</span>
            <div id="dynamic-chat"></div>
        </section>

        <section aria-label="Twitch editor">
            <p class="chat-wysiwyg-input__placeholder" aria-hidden="true">Send a message</p>
            <div id="twitch-editor" role="textbox" aria-multiline="true" data-a-target="chat-input"
                class="chat-wysiwyg-input__editor" contenteditable="true" data-slate-editor="true">
                <div data-slate-node="element" aria-hidden="true">vedal </div>
            </div>
        </section>

        <section aria-label="Autocomplete">
            <div id="plain-editor" role="textbox" aria-label="Test chat input" contenteditable="true"></div>
            <textarea id="picker-textarea" aria-label="Picker textarea"></textarea>
        </section>

        <div id="shadow-host"></div>
        <div aria-hidden="true" style="height:1200px"></div>
    </main>

    <script>
        const storageData = {
            enabled: true,
            siteAccessDefault: true,
            enabledSites: [],
            disabledSites: [],
            enabledUnsupportedSites: [],
            excludedEmote: [],
            emoteSize: 2,
            zeroWidthEmote: true,
            zeroWidthText: false,
            emoteHoverStyle: "card",
            emoteHoverLayout: "right",
            emoteHoverTemplate: "{original} ({emote}@{channel})",
            emoteHoverDelay: 100,
            pickerEnabled: true,
            pickerLayout: new URL(location.href).searchParams.has("sidebar") ? "sidebar" : "tabs",
            pickerFavorites: [],
            pickerUsage: {}
        }
        const storageListeners = []
        const baseEmotes = [
            { name: "PauseSama", id: "pause", url: "/extension/icons/icon-16.png", channelId: "test", channelName: "Test channel", provider: "7tv" },
            { name: "LETSGO", id: "go", url: "/extension/icons/icon-16.png", channelId: "test", channelName: "Test channel", provider: "7tv" },
            { name: "vedalCheer", id: "twitch-cheer", url: "/extension/icons/icon-16.png", channelId: "test", channelName: "Test channel", provider: "twitch", setName: "Twitch" },
            { name: "GlobalNormal", id: "global-normal", url: "/extension/icons/icon-16.png", channelId: "global", channelName: "Global 7TV", provider: "7tv" },
            { name: "RainTime", id: "rain", url: "/extension/icons/icon-16.png", channelId: "global", channelName: "Global 7TV", provider: "7tv", zeroWidth: true }
        ]
        const emotes = new URL(location.href).searchParams.has("large")
            ? baseEmotes.concat(Array.from({ length: 1200 }, (_, index) => ({
                name: `VirtualEmote${String(index + 1).padStart(4, "0")}`,
                id: `virtual-${index + 1}`,
                url: `/extension/icons/icon-16.png?virtual=${index + 1}`,
                channelId: "test",
                channelName: "Test channel"
            })))
            : baseEmotes

        globalThis.chrome = {
            runtime: {
                getURL: path => new URL(`/extension/${path}`, location.href).href,
                sendMessage: async message => {
                    if (message.type === "IS_SITE_UNSUPPORTED") return { unsupported: false }
                    if (message.type === "GET_EMOTES") return { emotes }
                    if (message.type === "GET_SUGGESTIONS") {
                        const query = String(message.query || "").toLowerCase()
                        return { suggestions: emotes.filter(emote => emote.name.toLowerCase().includes(query)) }
                    }
                    if (message.type === "GET_PICKER_DATA") return {
                        emotes,
                        channels: [
                            { id: "global", name: "Global 7TV", count: emotes.filter(emote => emote.channelId === "global").length },
                            { id: "test", name: "Test channel", avatarUrl: "/extension/icons/icon-48.png", count: emotes.filter(emote => emote.channelId === "test").length }
                        ]
                    }
                    return {}
                },
                onMessage: { addListener() {} }
            },
            storage: {
                local: {
                    async get(keys) {
                        if (typeof keys === "string") return { [keys]: storageData[keys] }
                        const list = Array.isArray(keys) ? keys : Object.keys(keys || {})
                        return Object.fromEntries(list.map(key => [key, storageData[key]]))
                    },
                    async set(values) {
                        const changes = {}
                        for (const [key, value] of Object.entries(values)) {
                            changes[key] = { oldValue: storageData[key], newValue: value }
                            storageData[key] = value
                        }
                        storageListeners.forEach(listener => listener(changes, "local"))
                    }
                },
                onChanged: { addListener(listener) { storageListeners.push(listener) } }
            }
        }

        const shadow = document.getElementById("shadow-host").attachShadow({ mode: "open" })
        const shadowMessage = document.createElement("span")
        shadowMessage.id = "shadow-message"
        shadowMessage.textContent = "PauseSama"
        shadow.appendChild(shadowMessage)

        setTimeout(() => {
            const line = document.createElement("span")
            line.id = "dynamic-message"
            line.textContent = "LETSGO"
            document.getElementById("dynamic-chat").appendChild(line)
        }, 100)

        if (new URL(location.href).searchParams.has("disable")) setTimeout(() => {
            const oldValue = storageData.enabled
            storageData.enabled = false
            storageListeners.forEach(listener => listener({
                enabled: { oldValue, newValue: false }
            }, "local"))
        }, 250)
    </script>
    <script src="/extension/content/render.js"></script>
    <script src="/extension/content/hover.js"></script>
    <script src="/extension/content/autocomplete.js"></script>
    <script src="/extension/content/picker.js"></script>
</body>
</html>
